[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "s2rdoi"
version = "0.1.0"
description = "CLI and REST API tool for registering and managing DOIs via DataCite"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1",
    "datacite>=1.1",
    "flask>=3.0",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.scripts]
s2rdoi = "s2rdoi.cli:main"

[project.optional-dependencies]
tests = [
  "ruff>=0.15.0",
  "ty>=0.0.44",
]

[tool.isort]
profile = "black"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "BLE001",
  "TC",
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "ANN201",
]


[tool.mypy]
extra_checks = true
strict = true
strict_bytes = true
strict_equality = true
follow_untyped_imports = true
disallow_any_generics = false
python_executable = ".venv/bin/python"
